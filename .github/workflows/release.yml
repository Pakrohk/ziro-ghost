name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, artifact: linux-x86_64 }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu, artifact: linux-aarch64, cross: true }
          - { os: macos-latest,  target: aarch64-apple-darwin,       artifact: darwin-arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross-compile tools
        if: matrix.cross
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.target }}
      - name: Strip binary
        run: |
          BIN=target/${{ matrix.target }}/release/ghost-popup
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            if [[ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]]; then
              aarch64-linux-gnu-strip --strip-all "$BIN" || strip --strip-all "$BIN" || true
            else
              strip --strip-all "$BIN"
            fi
          else
            strip -x "$BIN"
          fi
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghost-popup-${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/ghost-popup

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Organize release assets
        run: |
          mkdir -p release
          for d in artifacts/*/; do
            name=$(basename "$d" | sed 's/ghost-popup-//')
            cp "$d/ghost-popup" "release/ghost-popup-$name"
            chmod +x "release/ghost-popup-$name"
          done
          cp install.sh release/install.sh
          cd release
          sha256sum ghost-popup-* install.sh > SHA256SUMS
          cat SHA256SUMS
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/*
          generate_release_notes: false
          body_path: .github/RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
